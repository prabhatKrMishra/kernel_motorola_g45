name: Build Fogos Kernel (KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🧰 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev lz4 libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev

      - name: ⚙️ Setup Clang
        run: |
          git clone --depth=1 https://github.com/llvm/llvm-project clang

      - name: ⚙️ Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          export PATH=$PWD/clang/bin:$PATH

          mkdir out

          make O=out vendor/fogos_defconfig

          # 🔥 FIX YOUR MAIN PROBLEM HERE
          scripts/config --file out/.config -d CONFIG_LTO_CLANG
          scripts/config --file out/.config -d CONFIG_CFI_CLANG
          scripts/config --file out/.config -d CONFIG_CFI_CLANG_SHADOW
          scripts/config --file out/.config -d CONFIG_DEBUG_INFO
          scripts/config --file out/.config -d CONFIG_DEBUG_INFO_BTF
          scripts/config --file out/.config -d CONFIG_WERROR

          make O=out olddefconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: 📦 Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image*
