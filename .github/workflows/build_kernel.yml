name: Build Motorola G45 Kernel Fast

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget curl zip unzip python3 make clang gcc bc bison flex libncurses-dev rsync libssl-dev

      - name: Load defconfig
        run: |
          cd kernel_motorola_fogos
          cp arch/arm64/configs/vendor/lahaina_GKI.config arch/arm64/configs/lahaina_GKI_defconfig
          make ARCH=arm64 lahaina_GKI_defconfig

      - name: Build kernel (fast)
        run: |
          cd kernel_motorola_fogos
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE

      - name: Archive compiled kernel
        run: |
          cd kernel_motorola_fogos
          mkdir -p out
          cp arch/arm64/boot/Image.gz-dtb out/
          cp arch/arm64/boot/dts/qcom/*.dtb out/ || true
          zip -r kernel_build.zip out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorola_g45_kernel
          path: kernel_motorola_fogos/kernel_build.zip
