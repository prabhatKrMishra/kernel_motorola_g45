name: Build KernelSU for Moto G45 (Fogos)

on:
  workflow_dispatch: # Allows you to start the build manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm wget curl

      - name: Download AOSP Clang
        run: |
          mkdir clang
          cd clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
          tar -xf clang-r487747c.tar.gz
          cd ..

      - name: Setup KernelSU
        run: |
          # Automatically patches the kernel source to include KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Clean and Load Config
          make O=out vendor/fogos_defconfig
          
          # 2. Force Enable KernelSU configs
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_OVERLAY_FS=y" >> out/.config

          # 3. Compile
          make -j$(nproc --all) O=out \
                      CC=clang \
                      LLVM=1 \
                      LLVM_IAS=1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-G45-Fogos
          path: out/arch/arm64/boot/Image
